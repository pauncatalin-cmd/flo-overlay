<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FLO Neon Gaming Overlay</title>

<style>
:root{
  --scene-width:1080px;
  --scene-height:1920px;

  /* Pozitie texte slide pe canvas 1080x1920 */
  --bar-width:1080px;
  --bar-height:150px;
  --bar-top:547px;
  --slide-font-size:26px;
  --thanks-font-size:26px;

  --blue:#1eff00;
  --cyan:#ff4d4d;
  --green:#1eff00;
  --red:#ff4d4d;
  --pink:#ff4d4d;
  --discord:#5c85ff;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html, body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent;
  font-family:Arial, Helvetica, sans-serif;
}

#stage{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:transparent;
}

.scene{
  position:absolute;
  width:var(--scene-width);
  height:var(--scene-height);
  overflow:hidden;
  background:transparent;
  transform-origin:top left;
}

/* Fundal integrat sub bară. Zona webcamului rămâne transparentă. */
.lower-black-background{
  position:absolute;
  left:0;
  top:697px;
  width:1080px;
  height:1223px;
  background:
    linear-gradient(to bottom, rgba(0,0,0,.08) 0%, rgba(0,0,0,.32) 48%, rgba(0,0,0,.82) 100%),
    radial-gradient(circle at 50% 20%, rgba(30,255,0,.10), transparent 42%),
    url("overlayflo.png") center top / 1080px auto no-repeat,
    #000;
  opacity:.82;
  filter:saturate(.92) contrast(1.08) brightness(.78);
  z-index:1;
  pointer-events:none;
}

.lower-black-background::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(90deg, rgba(0,0,0,.70), transparent 22%, transparent 78%, rgba(0,0,0,.70)),
    linear-gradient(to bottom, rgba(0,0,0,.12), rgba(0,0,0,.72));
  box-shadow:inset 0 0 90px rgba(0,0,0,.88);
}

























.particle{
  position:absolute;
  bottom:-18px;
  
  opacity:0;
  z-index:10;
  animation-name:particleUp;
  animation-timing-function:linear;
  animation-iteration-count:infinite;
}

@keyframes particleUp{
  0%{transform:translate3d(0,0,0) scale(.55) rotate(var(--start-rot));opacity:0;}
  8%{opacity:.92;}
  55%{opacity:.78;}
  100%{transform:translate3d(var(--drift), -1180px, 0) scale(1.12) rotate(var(--end-rot));opacity:0;}
}





/* TEXTE PROMO SI NUME DIN COMUNITATE, FARA CHENAR SAU FUNDAL */
.floating-promo{
  position:absolute;
  left:0;
  bottom:-70px;
  z-index:12;
  pointer-events:none;
  white-space:nowrap;
  opacity:0;
  will-change:transform, opacity, filter;
  animation:floatingPromoUp var(--float-duration) linear forwards;
}

.floating-promo-inner{
  display:block;
  padding:0;
  border:0;
  background:transparent;
  color:rgba(255,255,255,var(--float-opacity));
  font-size:var(--float-size);
  font-weight:1000;
  letter-spacing:var(--float-spacing);
  text-transform:var(--float-transform);
  text-shadow:
    0 0 3px rgba(255,255,255,var(--float-white-glow)),
    0 0 var(--float-glow-small) var(--float-color),
    0 0 var(--float-glow-large) color-mix(in srgb, var(--float-color) var(--float-glow-mix), transparent);
  animation:floatingPromoPulse var(--pulse-duration) ease-in-out infinite;
}

.floating-promo.community-name .floating-promo-inner{
  font-weight:900;
}

.floating-promo.promo-text .floating-promo-inner{
  font-weight:1000;
}

@keyframes floatingPromoUp{
  0%{
    transform:translate3d(0,0,0) scale(.72) rotate(var(--float-rotate));
    opacity:0;
    filter:blur(calc(var(--float-blur) + 3px));
  }
  12%{
    opacity:var(--float-opacity);
    filter:blur(var(--float-blur));
  }
  42%{
    transform:translate3d(var(--curve-a), -315px, 0) scale(.92) rotate(calc(var(--float-rotate) * .35));
    opacity:calc(var(--float-opacity) * .92);
  }
  72%{
    transform:translate3d(var(--curve-b), -545px, 0) scale(1.02) rotate(calc(var(--float-rotate) * -.25));
    opacity:calc(var(--float-opacity) * .68);
  }
  100%{
    transform:translate3d(var(--float-drift), -780px, 0) scale(1.10) rotate(calc(var(--float-rotate) * -.55));
    opacity:0;
    filter:blur(calc(var(--float-blur) + 2px));
  }
}

@keyframes floatingPromoPulse{
  0%,100%{transform:scale(1);filter:brightness(1);}
  50%{transform:scale(var(--pulse-scale));filter:brightness(1.16);}
}


/* SLIDE TEXT, ACUM IN ACELASI BROWSER SOURCE */
.full-overlay{
  position:absolute;
  left:0;
  top:var(--bar-top);
  width:1080px;
  height:var(--bar-height);
  overflow:visible;
  background:transparent;
  z-index:40;
  pointer-events:none;
}

.mega-bar{
  position:absolute;
  inset:0;
  width:var(--bar-width);
  height:var(--bar-height);
  overflow:visible;
  background:transparent;
  z-index:6;
}

.row{
  position:absolute;
  left:0;
  z-index:7;
  width:var(--bar-width);
  height:70px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:visible;
}

.row-top{top:4px;}
.row-bottom{top:78px;}



.slide{
  position:absolute;
  inset:0;
  z-index:8;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  padding:0 18px;
  overflow:visible;
}

.slide.thanks-slide{
  top:0;
  left:0;
  width:var(--bar-width);
  height:var(--bar-height);
  align-items:center;
  justify-content:center;
  flex-wrap:nowrap;
  gap:0;
  padding:0;
}

.main{
  color:#ffffff;
  font-size:var(--thanks-font-size);
  font-weight:1000;
  line-height:1;
  letter-spacing:1px;
  text-shadow:
    0 0 4px #ffffff,
    0 0 10px var(--pink),
    0 0 18px rgba(30,255,0,.75),
    0 0 26px rgba(30,255,0,.45);
}

.slide.entering{
  opacity:0;
  transform:scale(.985);
  animation:slideFadeIn .36s ease-out forwards;
}

.slide.entering .char{
  opacity:1;
  transform:translateY(0) translateX(0) rotateZ(0deg) scale(1);
  filter:blur(0);
}

.slide.active{
  opacity:1;
  transform:scale(1);
}

.slide.active .char{
  opacity:1;
  transform:translateY(0) translateX(0) rotateZ(0deg) scale(1);
  filter:blur(0);
}

.slide.active .message-content{
  animation:heartBeatMessage 1.55s ease-in-out infinite;
  transform-origin:center;
}

.slide.leaving{
  pointer-events:none;
  animation:slideFadeOut .30s ease-in forwards;
}

.slide.leaving .char{
  opacity:1;
  animation:none;
}

.message-content{
  position:relative;
  z-index:10;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  white-space:nowrap;
  transform-origin:center;
}

.thanks-slide .message-content{
  width:100%;
  justify-content:center;
  gap:0;
}

@keyframes slideFadeIn{
  0%{opacity:0;transform:scale(.985);filter:blur(3px);}
  100%{opacity:1;transform:scale(1);filter:blur(0);}
}

@keyframes slideFadeOut{
  0%{opacity:1;transform:scale(1);filter:blur(0);}
  100%{opacity:0;transform:scale(.985);filter:blur(3px);}
}

@keyframes heartBeatMessage{
  0%, 14%, 28%, 100%{transform:scale(1);filter:brightness(1);}
  7%{transform:scale(1.045);filter:brightness(1.16);}
  21%{transform:scale(1.025);filter:brightness(1.08);}
}

.logo{
  width:58px;
  height:58px;
  object-fit:contain;
  flex-shrink:0;
  z-index:5;
  filter:
    drop-shadow(0 0 10px rgba(30,255,0,.95))
    drop-shadow(0 0 18px rgba(195,92,255,.55));
  animation:logoFloat 2.4s ease-in-out infinite;
}

.icon{
  font-size:36px;
  flex-shrink:0;
  z-index:5;
  filter:drop-shadow(0 0 12px var(--cyan));
  animation:logoFloat 2.4s ease-in-out infinite;
}

@keyframes logoFloat{
  0%,100%{transform:translateY(0) scale(1);}
  50%{transform:translateY(-4px) scale(1.06);}
}

.text{
  display:inline-flex;
  white-space:nowrap;
  position:relative;
  z-index:6;
  transform-origin:center;
}

.label{
  color:white;
  font-size:var(--slide-font-size);
  font-weight:1000;
  letter-spacing:.4px;
  text-shadow:
    0 1px 2px rgba(0,0,0,.9),
    0 0 5px rgba(255,255,255,.75),
    0 0 9px rgba(30,255,0,.45);
}

.main{
  color:var(--blue);
  font-size:var(--slide-font-size);
  font-weight:1000;
  line-height:1;
  text-shadow:
    0 2px 3px rgba(0,0,0,.9),
    0 0 6px rgba(184,77,255,.75),
    0 0 13px rgba(30,255,0,.38);
}

.troll-main{
  color:var(--pink);
  font-size:var(--slide-font-size);
  font-weight:1000;
  line-height:1;
  text-shadow:
    0 2px 3px rgba(0,0,0,.9),
    0 0 6px rgba(30,255,0,.78),
    0 0 14px rgba(30,255,0,.42);
}

.small{
  color:white;
  font-size:var(--slide-font-size);
  font-weight:900;
  text-shadow:
    0 1px 2px rgba(0,0,0,.9),
    0 0 5px rgba(255,255,255,.72),
    0 0 9px rgba(30,255,0,.38);
}

.green{
  color:var(--green);
  text-shadow:
    0 2px 3px rgba(0,0,0,.9),
    0 0 6px rgba(195,92,255,.8),
    0 0 13px rgba(195,92,255,.42);
}

.red{
  color:var(--red);
  text-shadow:
    0 2px 3px rgba(0,0,0,.9),
    0 0 6px rgba(255,23,68,.8),
    0 0 13px rgba(255,23,68,.42);
}

.discord{
  color:var(--discord);
  text-shadow:
    0 2px 3px rgba(0,0,0,.9),
    0 0 6px rgba(168,85,247,.8),
    0 0 13px rgba(168,85,247,.42);
}

.char{
  display:inline-block;
  opacity:0;
  transform-origin:center;
  will-change:transform, opacity, filter;
}

.spark{
  position:absolute;
  z-index:9;
  width:4px;
  height:4px;
  
  background:var(--pink);
  box-shadow:
    0 0 8px var(--pink),
    0 0 18px rgba(30,255,0,.9);
  opacity:0;
  animation:sparkMove 2.2s ease-in-out infinite;
  animation-delay:var(--spark-delay);
  z-index:2;
}

.row-bottom .spark{
  background:var(--cyan);
  box-shadow:
    0 0 8px var(--cyan),
    0 0 18px rgba(30,255,0,.9);
}

@keyframes sparkMove{
  0%{opacity:0;transform:translateY(8px) scale(.4);}
  35%{opacity:1;transform:translateY(-4px) scale(1.2);}
  100%{opacity:0;transform:translateY(-20px) scale(.5);}
}

.pill{
  position:relative;
  z-index:6;
  padding:4px 10px;
  border-radius:999px;
  background:var(--green);
  color:#061006;
  font-size:var(--slide-font-size);
  font-weight:1000;
  white-space:nowrap;
  box-shadow:
    0 0 12px var(--green),
    0 0 24px rgba(195,92,255,.8);
  animation:pillPulse 1.8s ease-in-out infinite;
}

.danger-pill{
  background:var(--red);
  color:white;
  box-shadow:
    0 0 12px var(--red),
    0 0 26px rgba(255,23,68,.8);
}

@keyframes pillPulse{
  0%,100%{transform:scale(1);filter:brightness(1);}
  50%{transform:scale(1.04);filter:brightness(1.18);}
}

.platforms{
  display:flex;
  gap:7px;
  z-index:6;
}

.platform{
  width:32px;
  height:32px;
  border-radius:10px;
  display:grid;
  place-items:center;
  background:rgba(0,0,0,.25);
  border:2px solid var(--cyan);
  color:white;
  font-size:17px;
  font-weight:1000;
  box-shadow:0 0 12px rgba(30,255,0,.9);
  animation:platformBounce 1.8s ease-in-out infinite;
}

.platform.kick{
  border-color:var(--green);
  color:var(--green);
  box-shadow:0 0 12px rgba(195,92,255,.9);
}

.platform.yt{
  border-color:var(--red);
  color:var(--red);
  box-shadow:0 0 12px rgba(255,23,68,.9);
}

@keyframes platformBounce{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-3px);}
}

.discord-logo{
  width:40px;
  height:40px;
  display:grid;
  place-items:center;
  border-radius:14px;
  background:rgba(168,85,247,.18);
  box-shadow:
    0 0 14px rgba(168,85,247,1),
    0 0 28px rgba(168,85,247,.75);
  animation:logoFloat 2.4s ease-in-out infinite;
  z-index:6;
}

.discord-logo svg{
  width:32px;
  height:32px;
  filter:drop-shadow(0 0 8px rgba(168,85,247,1));
}

/* CHENAR FIX, CU TEXTUL FLO RIDICAT SI INTEGRAT IN LINIA DE SUS */
.fixed-text-frame{
  position:absolute;
  left:0;
  top:74px;
  width:1080px;
  height:76px;
  pointer-events:none;
  z-index:3;
  background:#000;
  box-shadow:
    inset 0 0 22px rgba(30,255,0,.08),
    0 0 14px rgba(0,0,0,.95);
}


.fixed-text-frame::before{
  content:"";
  position:absolute;
  inset:0;
  background:#000;
  z-index:-1;
}



/* Linia de jos a barei */
.fixed-text-frame::after{
  content:"";
  position:absolute;
  left:0;
  bottom:0;
  width:1080px;
  height:3px;
  background:linear-gradient(
    90deg,
    rgba(184,77,255,.18) 0%,
    rgba(30,255,0,.95) 20%,
    rgba(30,255,0,.95) 50%,
    rgba(30,255,0,.95) 80%,
    rgba(184,77,255,.18) 100%
  );
  background-size:220% 100%;
  filter:
    drop-shadow(0 0 4px rgba(30,255,0,.95))
    drop-shadow(0 0 10px rgba(30,255,0,.45));
  animation:frameFlow 3.2s linear infinite reverse;
  z-index:3;
}


.flo-title-background{
  position:absolute;
  left:50%;
  top:-36px;
  transform:translateX(-50%);
  width:192px;
  height:39px;
  background:#000;
  clip-path:polygon(10% 100%, 0 100%, 11% 0, 89% 0, 100% 100%, 90% 100%);
  z-index:1;
  box-shadow:
    0 0 12px rgba(30,255,0,.18),
    inset 0 0 14px rgba(92,133,255,.10);
}

/* Linia de sus este un singur traseu continuu */
.frame-top-svg{
  position:absolute;
  left:0;
  top:-36px;
  width:1080px;
  height:39px;
  overflow:visible;
  z-index:3;
  pointer-events:none;
  filter:
    drop-shadow(0 0 4px rgba(30,255,0,.95))
    drop-shadow(0 0 10px rgba(30,255,0,.45));
}

.frame-top-svg path{
  fill:none;
  stroke:url(#floFrameGradient);
  stroke-width:3;
  stroke-linecap:round;
  stroke-linejoin:round;
  vector-effect:non-scaling-stroke;
}

/* Textul FLO sta in interiorul formei ridicate */
.flo-divider-title{
  position:absolute;
  left:50%;
  top:-31px;
  transform:translateX(-50%);
  width:210px;
  height:38px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
  font-family:Arial Black, Impact, Arial, sans-serif;
  font-size:38px;
  font-weight:1000;
  font-style:italic;
  letter-spacing:14px;
  line-height:1;
  color:transparent;
  background:linear-gradient(
    90deg,
    #5c85ff 0%,
    #ffffff 18%,
    #1eff00 42%,
    #ff4d4d 62%,
    #ffffff 80%,
    #5c85ff 100%
  );
  background-size:240% 100%;
  -webkit-background-clip:text;
  background-clip:text;
  text-shadow:
    0 0 5px rgba(255,255,255,.86),
    0 0 12px rgba(92,133,255,.95),
    0 0 21px rgba(30,255,0,.58);
  z-index:5;
  animation:
    floTextFlow 3.2s linear infinite,
    floPulse 2.0s ease-in-out infinite;
}

/* Nu exista nicio linie sub textul FLO */
.flo-divider-title::before,
.flo-divider-title::after{
  display:none;
}

@keyframes frameFlow{
  from{background-position:0% 50%;}
  to{background-position:220% 50%;}
}

@keyframes floTextFlow{
  from{background-position:0% 50%;}
  to{background-position:220% 50%;}
}

@keyframes floPulse{
  0%,100%{
    transform:translateX(-50%) scale(1);
    filter:brightness(1);
  }
  50%{
    transform:translateX(-50%) scale(1.035);
    filter:brightness(1.18);
  }
}


/* Accente neon gaming */
.full-overlay::before{
  content:"";
  position:absolute;
  left:0;
  top:72px;
  width:1080px;
  height:82px;
  background:linear-gradient(90deg, transparent, rgba(30,255,0,.08), rgba(255,77,77,.08), transparent);
  filter:blur(12px);
  pointer-events:none;
}


.bar-icon{
  width:42px;
  height:42px;
  flex-shrink:0;
  object-fit:contain;
  filter:
    drop-shadow(0 0 5px rgba(255,255,255,.65))
    drop-shadow(0 0 12px rgba(30,255,0,.75));
  animation:logoFloat 2.4s ease-in-out infinite;
}

.bar-icon.member{
  filter:
    drop-shadow(0 0 5px rgba(255,255,255,.65))
    drop-shadow(0 0 12px rgba(255,77,77,.85));
}

.dollar-particle{
  position:absolute;
  bottom:-90px;
  z-index:10;
  pointer-events:none;
  opacity:0;
  color:#1eff00;
  font-family:Arial Black, Impact, Arial, sans-serif;
  font-weight:1000;
  line-height:1;
  text-shadow:
    0 0 2px rgba(255,255,255,.28),
    0 0 6px rgba(30,255,0,.58),
    0 0 12px rgba(30,255,0,.34);
  animation-name:dollarFloatUp;
  animation-timing-function:linear;
  animation-iteration-count:infinite;
}

@keyframes dollarFloatUp{
  0%{
    transform:translate3d(0,0,0) scale(.55) rotate(var(--start-rot));
    opacity:0;
  }
  10%{opacity:.38;}
  65%{opacity:.28;}
  100%{
    transform:translate3d(var(--drift),-1160px,0) scale(1.10) rotate(var(--end-rot));
    opacity:0;
  }
}


.fixed-text-frame{
  overflow:visible;
}

.fixed-text-frame .bar-glow{
  position:absolute;
  inset:0;
  z-index:0;
  pointer-events:none;
  background:
    linear-gradient(90deg,
      transparent 0%,
      rgba(30,255,0,.12) 24%,
      rgba(92,133,255,.10) 50%,
      rgba(255,77,77,.12) 76%,
      transparent 100%);
  background-size:220% 100%;
  animation:barGlowFlow 4s linear infinite;
}

@keyframes barGlowFlow{
  from{background-position:0% 50%;}
  to{background-position:220% 50%;}
}

</style>
</head>

<body>
  <div id="stage">
    <div class="scene" id="scene">

      <div class="lower-black-background"></div>

      <div class="full-overlay">
        <div class="fixed-text-frame">
          <div class="bar-glow"></div>
          <div class="flo-title-background"></div>
          <svg class="frame-top-svg" viewBox="0 0 1080 39" preserveAspectRatio="none" aria-hidden="true">
            <defs>
              <linearGradient id="floFrameGradient" x1="0" y1="0" x2="1080" y2="0" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#5c85ff" stop-opacity=".45"/>
                <stop offset="22%" stop-color="#1eff00"/>
                <stop offset="50%" stop-color="#ff4d4d"/>
                <stop offset="78%" stop-color="#1eff00"/>
                <stop offset="100%" stop-color="#5c85ff" stop-opacity=".45"/>
              </linearGradient>
            </defs>
            <path d="M 0 37 H 444 L 464 2 H 616 L 636 37 H 1080"/>
          </svg>
          <div class="flo-divider-title">FLO</div>
        </div>
        <div class="mega-bar">
          <div class="row row-bottom" id="mainRow"></div>
        </div>
      </div>
    </div>
  </div>

<script>
/* SCALE 1080x1920 PENTRU OBS */
const stage = document.getElementById("stage");
const scene = document.getElementById("scene");

function fitScene(){
  const baseWidth = 1080;
  const baseHeight = 1920;

  const scale = Math.min(
    window.innerWidth / baseWidth,
    window.innerHeight / baseHeight
  );

  const left = (window.innerWidth - baseWidth * scale) / 2;
  const top = (window.innerHeight - baseHeight * scale) / 2;

  scene.style.transform = "translate(" + left + "px, " + top + "px) scale(" + scale + ")";
}

window.addEventListener("resize", fitScene);
window.addEventListener("load", fitScene);
fitScene();

/* PARTICULE BACKGROUND: simboluri dolar simple, fără cerc și fără fundal */
const particleCount = 18;

function createDollarParticle(){
  const p = document.createElement("div");
  p.className = "dollar-particle";
  p.textContent = "$";

  const left = Math.random() * 1000 + 20;
  const duration = Math.random() * 5 + 6.5;
  const delay = Math.random() * 7;
  const drift = (Math.random() * 180 - 90) + "px";
  const size = Math.random() * 18 + 28;

  p.style.left = left + "px";
  p.style.fontSize = size + "px";
  p.style.animationDuration = duration + "s";
  p.style.animationDelay = delay + "s";
  p.style.setProperty("--drift", drift);

}

/* TEXTE PROMO SI NUME ALEATORII PRINTRE PARTICULE */
const floatingPromoTexts = [
  {text:"FLO", weight:2},
  {text:"REFERAL 24616", weight:3},
  {text:"MULȚUMESC PENTRU SUSȚINERE", weight:4}
];

const floatingPromoColors = ["#ff4d4d", "#1eff00", "#5c85ff", "#ffffff"];
let activeFloatingPromos = 0;
const maxFloatingPromos = 3;

function weightedFloatingText(){
  const total = floatingPromoTexts.reduce((sum, item) => sum + item.weight, 0);
  let pick = Math.random() * total;

  for(const item of floatingPromoTexts){
    pick -= item.weight;
    if(pick <= 0) return item.text;
  }

  return floatingPromoTexts[0].text;
}

function createFloatingText(kind, forcedText = "", leftBias = null){
  if(activeFloatingPromos >= maxFloatingPromos) return null;

  const promo = document.createElement("div");
  const isCommunity = false;
  promo.className = "floating-promo promo-text";

  const text = forcedText || weightedFloatingText();
  const color = floatingPromoColors[Math.floor(Math.random() * floatingPromoColors.length)];

  const duration = 7.2 + Math.random() * 4.8;
  const driftValue = Math.random() * 220 - 110;
  const curveStrength = Math.random() < 0.20 ? 1.45 : 0.72;
  const curveA = driftValue * (0.22 + Math.random() * 0.28) + (Math.random() * 60 - 30) * curveStrength;
  const curveB = driftValue * (0.58 + Math.random() * 0.22) + (Math.random() * 70 - 35) * curveStrength;
  const rotate = (Math.random() * 16 - 8) + "deg";
  const fontSize = text === "FLO" ? 24 + Math.random() * 10 : 18 + Math.random() * 8;
  const opacity = 0.28 + Math.random() * 0.34;
  const blur = Math.random() < 0.28 ? 0.8 + Math.random() * 1.2 : Math.random() * 0.35;
  const spacing = text === "FLO"
    ? 3 + Math.random() * 4
    : 0.4 + Math.random() * 1.4;
  const estimatedWidth = text.length * fontSize * 0.62;
  const randomLeft = Math.max(24, Math.random() * Math.max(40, 1080 - estimatedWidth - 24));
  const safeLeft = leftBias === null
    ? randomLeft
    : Math.max(24, Math.min(1080 - estimatedWidth - 24, leftBias + Math.random() * 70 - 35));

  promo.style.left = safeLeft + "px";
  promo.style.setProperty("--float-color", color);
  promo.style.setProperty("--float-duration", duration + "s");
  promo.style.setProperty("--float-drift", driftValue + "px");
  promo.style.setProperty("--curve-a", curveA + "px");
  promo.style.setProperty("--curve-b", curveB + "px");
  promo.style.setProperty("--float-rotate", rotate);
  promo.style.setProperty("--float-size", fontSize + "px");
  promo.style.setProperty("--float-opacity", opacity.toFixed(2));
  promo.style.setProperty("--float-blur", blur.toFixed(2) + "px");
  promo.style.setProperty("--float-spacing", spacing.toFixed(1) + "px");
  promo.style.setProperty("--pulse-duration", (1.6 + Math.random() * 1.2).toFixed(2) + "s");
  promo.style.setProperty("--pulse-scale", (1.02 + Math.random() * 0.035).toFixed(3));
  promo.style.setProperty("--float-transform", "uppercase");
  promo.style.setProperty("--float-white-glow", "0");
  promo.style.setProperty("--float-glow-small", "9px");
  promo.style.setProperty("--float-glow-large", "18px");
  promo.style.setProperty("--float-glow-mix", "62%");

  promo.innerHTML = `<div class="floating-promo-inner">${text}</div>`;

  activeFloatingPromos++;
  scene.appendChild(promo);

  promo.addEventListener("animationend", () => {
    promo.remove();
    activeFloatingPromos = Math.max(0, activeFloatingPromos - 1);
  }, {once:true});

  return {text, left:safeLeft};
}

function spawnFloatingPromo(){
  return;
  if(activeFloatingPromos >= maxFloatingPromos) return;

  /* Majoritatea raman doar particule, ocazional apare un text promo. */
  if(Math.random() < 0.78) return;
  createFloatingText("promo");

}

setInterval(spawnFloatingPromo, 1250);
setTimeout(spawnFloatingPromo, 900);
setTimeout(spawnFloatingPromo, 2600);


/* SLIDE TEXTE */
const slideTime = 4500;
const fadeOutTime = 300;
const fadeInTime = 360;

const trollItems = [];

const promoItems = [
  {icon:"💚", label:"MULȚUMESC PENTRU", main:"SUSȚINERE"},
  {img:"tiktok.png", imgClass:"bar-icon", label:"NU UITA DE", main:"FOLLOW"},
  {icon:"🎁", label:"REFERAL", main:"24616", mainClass:"green"},
  {img:"member-heart.png", imgClass:"bar-icon member", label:"INIMĂ DE", main:"MEMBRU", mainClass:"red"},
  {icon:"👆", label:"MULȚUMESC PENTRU", main:"TAP - TAP"},
  {img:"tiktok.png", imgClass:"bar-icon", label:"LIVE PE", main:"TIK TOK", mainClass:"red"}
];

let trollIndex = 0;
let promoIndex = 0;

function textSpans(text, className){
  return `<span class="text ${className}">` + [...text].map((char, index) => {
    const center = (text.length - 1) / 2;
    const distance = index - center;
    const flyX = distance * 4;
    const flyR = distance * 2.6;
    const enterX = distance * -2.4;
    const enterR = distance * -1.4;

    return `<span class="char" style="--i:${index}; --fly-x:${flyX}px; --fly-r:${flyR}deg; --enter-x:${enterX}px; --enter-r:${enterR}deg;">${char === " " ? "&nbsp;" : char}</span>`;
  }).join("") + `</span>`;
}

function sparkles(){
  let html = "";
  for(let i = 0; i < 14; i++){
    const left = 70 + Math.random() * 860;
    const top = 8 + Math.random() * 52;
    const delay = Math.random() * 2;
    html += `<span class="spark" style="left:${left}px; top:${top}px; --spark-delay:${delay}s;"></span>`;
  }
  return html;
}

function discordLogo(){
  return `
  <div class="discord-logo">
    <svg viewBox="0 0 245 240" xmlns="http://www.w3.org/2000/svg">
      <path fill="#5c85ff" d="M104.4 103.9c-5.7 0-10.2 5-10.2 11.1s4.6 11.1 10.2 11.1c5.7 0 10.3-5 10.2-11.1.1-6.1-4.5-11.1-10.2-11.1zm36.2 0c-5.7 0-10.2 5-10.2 11.1s4.6 11.1 10.2 11.1c5.7 0 10.3-5 10.2-11.1.1-6.1-4.5-11.1-10.2-11.1z"/>
      <path fill="#5c85ff" d="M189.5 20h-134C44.2 20 35 29.2 35 40.6v135.2c0 11.4 9.2 20.6 20.5 20.6h113.4l-5.3-18.5 12.8 11.9 12.1 11.2L210 220V40.6c0-11.4-9.2-20.6-20.5-20.6zm-38.6 130.6s-3.6-4.3-6.6-8.1c13.1-3.7 18.1-11.9 18.1-11.9-4.1 2.7-8 4.6-11.5 5.9-5 2.1-9.8 3.5-14.5 4.3-9.6 1.8-18.4 1.3-25.9-.1-5.7-1.1-10.6-2.7-14.7-4.3-2.3-.9-4.8-2-7.3-3.4-.3-.2-.6-.3-.9-.5-.2-.1-.3-.2-.4-.3-1.8-1-2.8-1.7-2.8-1.7s4.8 8 17.5 11.8c-3 3.8-6.7 8.3-6.7 8.3-22.1-.7-30.5-15.2-30.5-15.2 0-32.2 14.4-58.3 14.4-58.3 14.4-10.8 28.1-10.5 28.1-10.5l1 1.2c-18 5.2-26.3 13.1-26.3 13.1s2.2-1.2 5.9-2.9c10.7-4.7 19.2-6 22.7-6.3.6-.1 1.1-.2 1.7-.2 6.1-.8 13-1 20.2-.2 9.5 1.1 19.7 3.9 30.1 9.6 0 0-7.9-7.5-24.9-12.7l1.4-1.6s13.7-.3 28.1 10.5c0 0 14.4 26.1 14.4 58.3 0 0-8.5 14.5-30.6 15.2z"/>
    </svg>
  </div>`;
}

function buildSlide(item, type){
  if(item.thanks){
    let html = `<div class="slide entering">`;
    html += sparkles();
    html += `<div class="message-content">`;
    html += textSpans(item.main, "main");
    html += `</div></div>`;
    return html;
  }

  let html = `<div class="slide entering">`;
  html += sparkles();
  html += `<div class="message-content">`;

  if(item.discord){
    html += discordLogo();
  } else if(item.img){
    html += `<img class="${item.imgClass || "logo"}" src="${item.img}" alt="">`;
  } else if(item.icon){
    html += `<div class="icon">${item.icon}</div>`;
  }

  html += textSpans(item.label, `label ${item.labelClass || ""}`);

  const mainClass = type === "promo" ? `main ${item.mainClass || ""}` : `troll-main ${item.color || ""}`;
  html += textSpans(item.main, mainClass);

  if(item.small){
    html += textSpans(item.small, "small");
  }

  if(item.pill){
    html += `<div class="pill ${item.danger ? "danger-pill" : ""}">${item.pill}</div>`;
  }

  if(item.platforms){
    html += `
    <div class="platforms">
      <div class="platform">♪</div>
      <div class="platform kick">K</div>
      <div class="platform yt">▶</div>
    </div>`;
  }

  html += `</div></div>`;
  return html;
}

function activateSlide(slide){
  setTimeout(() => {
    if(slide){
      slide.classList.remove("entering");
      slide.classList.add("active");
    }
  }, fadeInTime);
}

function switchSlide(rowId, items, index, type){
  if(!Array.isArray(items)) items = [items];

  const row = document.getElementById(rowId);
  const overlay = document.querySelector(".full-overlay");
  const nextItem = items[index];

  if(type === "promo" && nextItem && nextItem.thanks){
    overlay.classList.add("showing-thanks");
  } else {
    overlay.classList.remove("showing-thanks");
  }

  const oldSlide = row.querySelector(".slide");

  const insertNextSlide = () => {
    row.innerHTML = buildSlide(nextItem, type);
    const newSlide = row.querySelector(".slide");
    activateSlide(newSlide);
  };

  if(oldSlide){
    oldSlide.classList.remove("active", "entering");
    oldSlide.classList.add("leaving");

    setTimeout(() => {
      oldSlide.remove();
      insertNextSlide();
    }, fadeOutTime);
  } else {
    insertNextSlide();
  }
}

const mergedItems = promoItems.map(item => ({type:"promo", item:item}));
let mergedIndex=0;
function startSlides(){
 switchSlide("mainRow", mergedItems[0].item,0, mergedItems[0].type);
 setInterval(()=>{
   mergedIndex=(mergedIndex+1)%mergedItems.length;
   const e=mergedItems[mergedIndex];
   switchSlide("mainRow", e.item,0,e.type);
 },slideTime);
}
startSlides();
